server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index DecideAI.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # No-cache untuk entry HTML + file src/* (Babel compile-time, berubah tiap deploy).
  location = /DecideAI.html { add_header Cache-Control "no-cache"; }
  location /src/ { add_header Cache-Control "no-cache"; }

  # Aset statis lain boleh di-cache lama.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / { try_files $uri $uri/ =404; }
}
